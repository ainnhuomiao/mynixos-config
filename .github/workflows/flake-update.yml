name: Flake Update

on:
  schedule:
    # 每周六 00:00 UTC = 08:00 北京时间 (按 UTC 用 cron)
    - cron: "0 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: true

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Update flake inputs
        run: nix flake update

      - name: Validate before opening PR
        run: nix flake check --print-build-logs

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          # PAT: bot 开的 PR 才会触发 nix.yml 的 pull_request CI (30 包构建 + check)
          token: ${{ secrets.BOT_TOKEN }}
          branch: bot/flake-update
          commit-message: "chore(flake): weekly flake.lock update"
          title: "chore(flake): weekly automatic flake.lock update"
          body: |
            GitHub Actions 每周六 08:00 (北京时间) 自动执行 `nix flake update` 生成。

            本 PR 会触发仓库完整 CI（`nix.yml`：30 包构建 + `nix flake check`）。
            请确认 CI 通过后合并；若锁定升级砸包，直接在 PR 上排查或关掉下轮再试。
          delete-branch: true
